name: Check tickets

on:
  workflow_dispatch: # main trigger, called every 10 min by cron-job.org; also manual runs
    inputs:
      heartbeat:
        description: Send a 💚 status push
        type: boolean
        default: false
  schedule:
    - cron: "*/10 * * * *" # backup; GitHub often delays or skips these
    - cron: "30 3 * * *" # 09:00 IST daily heartbeat

permissions:
  contents: write # to commit state.json

concurrency:
  group: check-tickets

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check BookMyShow
        run: python -m notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          HEARTBEAT: ${{ github.event.schedule == '30 3 * * *' || inputs.heartbeat == true }}

      - name: Commit state
        run: |
          git add state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update state"
          git pull --rebase
          git push
